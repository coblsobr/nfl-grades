# Checks every morning for a new, fully posted NFL week. Only rebuilds (and saves new data) when there is one,
# which is usually Tuesday or Wednesday. The app picks up the new data the next time it's opened.
name: weekly-update
on:
  schedule:
    - cron: "0 13 * * *"     # every day, 9am US Eastern
  workflow_dispatch: {}       # "Run workflow" button for a manual check
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nflreadpy polars pandas pyarrow scipy scikit-learn
      - name: Check for a new week, rebuild if there is one
        working-directory: pipeline
        env:
          DASH_DIR: ../docs/data/
        run: |
          mkdir -p cache output
          python update.py
      - name: Save new data
        run: |
          git config user.name "nfl-grades-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data pipeline/current.json
          if git diff --cached --quiet; then echo "No new week yet."; else git commit -m "New week of data" && git push; fi
